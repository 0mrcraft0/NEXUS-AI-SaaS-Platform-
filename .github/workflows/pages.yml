name: Deploy NEXUS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status_code="$(curl -sS -o /tmp/pages-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          case "${status_code}" in
            200)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::notice title=GitHub Pages not enabled::Enable Settings > Pages and set Source to GitHub Actions, then rerun this workflow."
              ;;
            *)
              cat /tmp/pages-response.json
              echo "::error::Unexpected response while checking GitHub Pages configuration (HTTP ${status_code})."
              exit 1
              ;;
          esac
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
